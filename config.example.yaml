# Example somora config. Real config lives at ~/.somora/config.yaml
# (created with sane defaults on first server start).
#
# Secrets:
# - Subscription engines (claude-cli, codex-cli) do not need any keys
#   here — they authenticate via their CLI's own `login` flow.
# - OpenAI-compatible providers (custom endpoints, OpenRouter, oMLX,
#   Ollama, …) read `apiKey` directly from this file. The recommended
#   posture is to put the keys here in plain text — ~/.somora/config.yaml
#   stays under your home, is never committed, and is the same file
#   somora itself reads.
# - For skills (CLI tools an agent shells out to via `exec`), credentials
#   go in env vars on the somora service (systemd EnvironmentFile, etc.)
#   — skill subprocesses don't read this file. See docs/skills.md.
#
# Provider names are free-form keys. Pick whatever's memorable for you:
# 'anthropic', 'ollama', 'lmstudio', 'home-gpu', 'pi-edge', etc.
#
# Per-model 'alias' lets you reference a model by short nickname anywhere
# (persona frontmatter, later /model in the CLI). Aliases must be globally
# unique across the whole config — server refuses to start otherwise.

server:
  # Bind address. Default 127.0.0.1 (loopback = private). Set 0.0.0.0 to
  # accept LAN / Tailscale clients — an explicit opt-in that lives here in
  # config.yaml so it survives `somora update` (a SOMORA_HOST env in the
  # systemd unit does NOT — the update rebakes the unit and drops it).
  host: 127.0.0.1
  port: 18737

# capabilities (per model):
#   text      — always present, plain text I/O
#   image     — accepts image input (vision)
#   reasoning — model exposes a thinking/reasoning-effort knob; per-engine
#               adapter applies the cross-engine /thinking setting only for
#               models with this capability. For models without it, the
#               setting is dormant and the TUI marks it accordingly.
providers:
  # Anthropic via Claude Code subscription. Uses the local Claude Code
  # binary (~/.local/bin/claude) — no baseUrl / apiKey needed.
  anthropic:
    engine: claude-cli
    models:
      - id: claude-opus-4-7
        alias: opus
        contextWindow: 1000000
        capabilities: [text, image, pdf, reasoning]
      - id: claude-sonnet-4-6
        alias: sonnet
        contextWindow: 200000
        capabilities: [text, image, pdf, reasoning]
      - id: claude-haiku-4-5
        alias: haiku
        contextWindow: 200000
        capabilities: [text, image, pdf]

  # OpenAI via Codex CLI subscription. Uses the local `codex` binary;
  # auth is handled by the binary itself via `codex login` (ChatGPT
  # Plus/Pro/Business subscription preferred) or OPENAI_API_KEY env.
  # No baseUrl / apiKey needed here. Override binary path with
  # SOMORA_CODEX_BIN env if not at ~/.npm-global/bin/codex or on PATH.
  # Codex CLI / OpenAI model IDs are subscription/provider-owned and
  # change with codex-cli releases (e.g. 0.130 retired `gpt-5`/`o3`,
  # renamed `gpt-5-codex` → `gpt-5.3-codex`). If you hit HTTP 400 from
  # the backend, run `codex models list` (or check the codex release
  # notes) for the current valid ids and update this block.
  openai:
    engine: codex-cli
    models:
      - id: gpt-5.5
        alias: gpt55
        contextWindow: 400000
        capabilities: [text, image, pdf, reasoning]
      - id: gpt-5.4-mini
        alias: gpt54mini
        contextWindow: 400000
        capabilities: [text, reasoning]
      - id: gpt-5.3-codex
        alias: codex53
        contextWindow: 400000
        capabilities: [text, reasoning]

  # Local OpenAI-compatible server (Ollama, LM Studio, oMLX, vLLM, ...).
  # Multiple providers of the same engine are fine — just give each a unique key.
  omlx:
    engine: openai-compatible
    baseUrl: http://localhost:11434/v1
    apiKey: lm-studio
    models:
      - id: gemma-4-31b-it-8bit
        alias: gemma4big
        contextWindow: 131072
        capabilities: [text, image]
      - id: gemma-4-26b-a4b-it-4bit
        alias: gemma4small
        contextWindow: 131072
        capabilities: [text, image]

  # Same engine, different host — totally fine.
  # ollama:
  #   engine: openai-compatible
  #   baseUrl: http://other-host.local:11434/v1
  #   apiKey: dummy
  #   models:
  #     - id: llama3.3:70b
  #       alias: llama
  #       contextWindow: 131072
  #       capabilities: [text]

  # OpenRouter — proxies Claude / GPT / many other models through an
  # openai-compatible API. Useful as a vision worker (Anthropic via
  # openrouter accepts native PDF document blocks) and for testing
  # alternative text models without their bespoke SDKs. Get a key at
  # openrouter.ai/keys.
  # openrouter:
  #   engine: openai-compatible
  #   baseUrl: https://openrouter.ai/api/v1
  #   apiKey: <YOUR_OPENROUTER_KEY>
  #   models:
  #     - id: anthropic/claude-haiku-4.5
  #       alias: orhaiku
  #       contextWindow: 200000
  #       capabilities: [text, image, pdf]      # vision worker candidate
  #     - id: minimax/minimax-m2.7
  #       alias: minimax27
  #       contextWindow: 197000
  #       capabilities: [text]
  #     - id: moonshotai/kimi-k2.5
  #       alias: kimi25
  #       contextWindow: 262144
  #       capabilities: [text]

# Vision / multimodal worker (Phase Y). Optional. When set, the
# `analyze_file` tool dispatches images and PDFs to the worker model
# and returns its text analysis — useful when the active main model
# lacks `image` capability or when you want a token-cheap description
# instead of dropping image-bytes into main context. Worker must be on
# `openai-compatible` engine in v1 (use openrouter to proxy Claude/
# GPT, same constraint as Dream-Mode).
#
# file_read polymorph (the workspace-drop UX) does NOT depend on this
# — it uses the active main model's `image` capability directly. The
# vision worker is only for the `analyze_file` route.
# vision:
#   worker: openrouter/anthropic/claude-haiku-4-5    # default for image + PDF
#   pdfWorker: openrouter/anthropic/claude-sonnet-4-6  # optional override for PDFs

# Speech-to-Text (Phase voice). Optional. When `enabled: true`, the
# web chat input grows a mic button next to send: click → record, click
# again → transcribe → text lands in the textarea ready to send. Audio
# is forwarded to an OpenAI-compatible STT endpoint
# (`POST /v1/audio/transcriptions`); supported upstreams include oMLX
# (mlx-audio backend), faster-whisper-server, OpenAI itself, etc.
#
# `provider` references an entry from `providers` above so connection
# details (baseUrl, apiKey) aren't duplicated. The STT model is NOT
# listed in `providers.<x>.models` — keeps it out of chat-model pickers,
# agent-config validation, and `/v1/models`.
#
# Browser-side capability gate: the mic button auto-hides when the
# browser lacks MediaRecorder / getUserMedia (e.g. some older Safari
# variants), so a feature that'd fail on click never tease-renders.
# stt:
#   enabled: true
#   provider: omlx                              # ← references providers.omlx
#   model: mlx-community/whisper-large-v3-turbo
#   language: de                                # optional default lang hint

# Text-to-Speech (TTS) — mirror of STT. Generates spoken audio from
# assistant text and serves it back to clients. Same posture: somora
# proxies to an OpenAI-compatible TTS upstream (oMLX, fish-audio, etc),
# the model is NOT listed in `providers.<x>.models`.
#
# Two flows are wired:
#   (1) Auto-TTS in normal chat: when you submit via mic AND the
#       per-session auto-play toggle is on, somora generates audio
#       for the assistant reply and the client auto-plays it. Pure
#       text turns and toggle-off sessions stay silent.
#   (2) /voice/turn HTTP endpoint: independent audio-in/audio-out
#       endpoint for integrations (panels, voice satellites, etc).
#       Always generates audio, regardless of toggles.
#
# Per-client policy seeds the localStorage toggle on first session
# open; users can flip it per chat window if `allowUserOverride` is
# true. Cache is content-addressed (sha256(text+voice+model+format)),
# lives at ~/.somora/tts-cache/, auto-GC'd by retention + size cap.
# tts:
#   enabled: true
#   provider: omlx                              # ← references providers.omlx
#   model: fish-audio-s2-pro-8bit
#   language: de                                # optional default lang hint
#   # voice: <id>                               # optional OpenAI-style speaker selector
#                                               #  (ignored by mlx-audio's fish adapter — see textPrefix)
#   #
#   # textPrefix is an inline string prepended to EVERY synthesize input.
#   # Used to push speaker / emotion / style tags into the text itself,
#   # which is how Fish Audio S2 Pro (and similar OSS TTS) actually steer
#   # voice — the `voice` JSON field is ignored. Example tags:
#   #   "<|speaker:0|>"          — lock speaker (Fish S2 has many)
#   #   "[deep male voice] "      — descriptive style tag
#   #   "<|speaker:7|>[calm] "    — combine speaker + emotion
#   # Acts as fallback when an agent has no entry in `agentVoices`.
#   # textPrefix: "<|speaker:0|>"
#   #
#   # agentVoices is a per-agent override map. When somora synthesises
#   # audio FOR agent X, the prefix from `agentVoices[X]` is used (and
#   # `textPrefix` is ignored). Agent names match the directory under
#   # ~/.somora/agents/<name>/. The prefix flows into the cache key so
#   # different speakers get different cached audio files.
#   # agentVoices:
#   #   naxon:  "[deep male voice] "
#   #   hans:   "<|speaker:7|>[male voice] "
#   #   lisa:   "<|speaker:2|>"
#   #   jarvis: "[deep male voice] "
#   #
#   cache:
#     retentionDays: 7                          # 0 disables GC
#     maxSizeMB: 500
#   reencode:
#     enabled: true                             # use ffmpeg for opus/m4a when client Accept asks
#     opusBitrateKbps: 24
#   clients:
#     web:
#       autoPlayVoiceReplies: false             # default for new sessions
#       allowUserOverride: true                 # show the 🔊/🔇 toggle in chat header
#     mobile:
#       autoPlayVoiceReplies: false
#       allowUserOverride: true

# Projects — pointer-file index over existing storage locations. Each
# project lives as ~/.somora/projects/<slug>.md with YAML frontmatter
# that lists Obsidian paths, local paths, URLs, and remote-resource
# refs (`<resource>:/path`). A session can `/projekt <slug>` to pin
# the project, and the pointer-list lands in the system-prompt tail so
# the agent knows which paths matter for this conversation.
#
# `entities` is a CONTROLLED VOCABULARY — projects belong to one
# entity (e.g. "privat", "enovom"), and the agent picks FROM this list
# at create time. Prevents STT mishearings from inventing phantom
# entities ("enofhom" silently becoming a new category). Only edited
# here — agents cannot extend it via tools.
# projects:
#   enabled: true
#   entities:
#     - slug: privat
#       label: Privat
#     - slug: enovom
#       label: enovom GmbH
#     - slug: firma2
#       label: Firma Zwei

# Compaction tunables (DECISION #21). All optional — built-in defaults apply
# when omitted. SOMORA_COMPACTION_* env vars override these for ops/CI.
# compaction:
#   triggerRatio: 0.8          # compact when context >= 80% of window
#   safetyCushionPairs: 4      # keep N most-recent user/assistant pairs uncompacted
#   modelOverride: opus        # force a specific worker model (alias or provider/id)

# Memory-Layer tunables (DECISIONS #25–#27). All optional. Per-agent
# overrides can live in agent.yaml later. (Phase 2-Stufe-B — not yet
# wired into the runtime.)
# Agent-loop tunables (DECISION #31 + #37). Apply to engines that run
# their own tool-call loop — currently openai-compatible — for the per-
# tool-call race. The longTask* values ALSO inform CLI-engine tools
# (subagent_result, agent_ask) which run inside MCP children, so all
# three engines honor the same caller-friendly politik for slow models.
#
# Three timeout knobs, each for a different tool class:
#   1. toolCallTimeoutMs       — fast tools (memory, web, file, time)
#   2. longTaskDefaultTimeoutMs — slow A2A tools, used when the caller
#                                 doesn't pass an explicit timeout_ms
#   3. longTaskMaxTimeoutMs    — hard ceiling for slow A2A tools, even
#                                 when the caller passes a higher value
#
# When a long-task hits its timeout, the tool returns state:"pending"
# (NOT an error) — the sub keeps running, the caller can retry with a
# higher timeout_ms or check status later. See DECISION #37.
# agentLoop:
#   maxRounds: 8                      # max tool-call rounds per turn (1..100).
#                                     # Most conversations finish in 1-3;
#                                     # 8 is defensive headroom against
#                                     # runaway models.
#
#   toolCallTimeoutMs: 30000          # 30 sec — fast tools (memory_search,
#                                     # web_fetch, time_now, file_read,
#                                     # obsidian_*). Plenty for anything
#                                     # that hits a local DB, reads a file,
#                                     # or does a single HTTP round-trip.
#                                     # Slow tools declare their own.
#
#   longTaskDefaultTimeoutMs: 300000  # 5 min — DEFAULT for slow A2A tools
#                                     # (subagent_result wait_until_done,
#                                     # agent_ask). Local models like
#                                     # gemma4big regularly need minutes
#                                     # for a turn — this default is
#                                     # generous so agents don't have to
#                                     # adapt with retries on every call.
#                                     # Used when caller omits timeout_ms.
#
#   longTaskMaxTimeoutMs: 1800000     # 30 min — HARD CEILING for slow A2A
#                                     # tools, even with explicit timeout_ms.
#                                     # Bounds how long a single tool call
#                                     # can sit blocking; the underlying
#                                     # sub-task itself runs unbounded in
#                                     # the background (capped by its own
#                                     # agentLoop.maxRounds), so this is
#                                     # really just a per-call ceiling.
#                                     # Raise for exceptionally slow setups
#                                     # (CPU-only inference, huge models).
#                                     # claudeCli.mcpToolTimeoutMs and
#                                     # codexCli.toolTimeoutSec MUST be ≥
#                                     # this — the CLI's MCP layer sits
#                                     # above us and will cut us off
#                                     # otherwise.


# Engine watchdog — idle-event timeout per engine. If an engine produces
# no events (assistant_delta, tool_call, …) for the configured window
# mid-turn, we assume the subprocess (claude-cli / codex-cli) died or
# the remote HTTP call (openai-compatible) is wedged. The turn is
# aborted, an error is surfaced to the client, and the per-session lock
# releases — so the user can simply send the next message instead of
# restarting the server. Dream workers (Deep/Lucid) bypass this entirely;
# they have their own timing.
# engineWatchdog:
#   claudeCliIdleMs: 300000        # 5 min — subscription, fast first event
#   codexCliIdleMs: 300000         # 5 min — subscription, fast first event
#   openaiCompatibleIdleMs: 1200000 # 20 min — local LLMs (oMLX, ollama, vLLM)
#                                  # can legitimately stream slowly on
#                                  # consumer hardware. Raise if your
#                                  # backend regularly silences for longer
#                                  # than 20 min mid-turn.

# SSE-broadcast tunables. Pro abonniertem Client (web/mobile/TUI) hat
# somora ein write-budget pro EINZELNEM event-paket. Eine gesunde
# writeSSE-write ist Mikrosekunden; ein wedged stream (Mobile-Browser
# im Hintergrund, gefrorenes TCP-receive-window, halbtoter TLS-
# handshake) backpressured sonst forever ohne zu throwen — und blockt
# damit JEDEN folgenden turn auf dieser (agent, session). Greift NICHT
# auf turn-Dauer / LLM-streaming-Zeit / langen tool-calls — die laufen
# weiter, weil jedes einzelne event-paket eh nur µs zum schreiben braucht.
# sse:
#   publishTimeoutMs: 10000        # 10s pro event-write — self-heal-budget für
#                                  # einen wedged subscriber. Greift faktisch nie
#                                  # bei gesunden clients; 2 Größenordnungen mehr
#                                  # als ein normaler write je dauert.
#   publishParallel: true          # alle subscriber gleichzeitig beschicken statt
#                                  # nacheinander — ein slow client blockt nie die
#                                  # anderen. Auf false stellen nur wenn du strikt
#                                  # serielle delivery-order brauchst.

# claude-cli engine tunables. Surfaced from claude-agent-sdk env vars so
# they're configurable here instead of hidden as undocumented env overrides.
# Applied at server boot; an explicit env var (MCP_TOOL_TIMEOUT etc.) wins
# over config (override layer).
# claudeCli:
#   mcpToolTimeoutMs: 1800000   # 30 min — per-MCP-tool-call timeout (ms);
#                               # sets MCP_TOOL_TIMEOUT in the claude-agent-sdk
#                               # subprocess. SDK hidden default is 5min — way
#                               # too short for slow local models. Default 30min
#                               # matches agentLoop.longTaskMaxTimeoutMs so the
#                               # CLI's MCP layer never cuts off a long-blocking
#                               # tool call before our own ceiling does. Raise
#                               # both together if you need more; lower this for
#                               # fail-fast on a fast setup.
#   mcpConnectTimeoutMs: 60000  # 60 sec — initial MCP server connect handshake
#                               # timeout (ms); sets MCP_TIMEOUT. Only affects
#                               # startup, not running calls.

# codex-cli engine tunables. Same posture as claudeCli — surface codex-
# internal limits so they're configurable here. Applied via -c TOML
# overrides on each `codex exec` invocation.
# codexCli:
#   toolTimeoutSec: 1800      # 30 min — per-MCP-tool-call timeout in
#                             # seconds; sets mcp_servers.somora-memory.tool_timeout_sec
#                             # in codex's TOML. Codex's hidden default is
#                             # 60s — way too short for slow local models.
#                             # Default 1800s matches claudeCli.mcpToolTimeoutMs
#                             # and agentLoop.longTaskMaxTimeoutMs so the CLI's
#                             # MCP layer never cuts off a long-blocking tool
#                             # call before our own ceiling does.
#   shellEnvironmentPolicy: inherit-all
#                             # 'inherit-all' (default) — pass the full somora-
#                             # server process env into codex's exec-tool shells.
#                             # Required for skills like `gog` that depend on env
#                             # secrets (GOG_KEYRING_PASSWORD, GOG_ACCOUNT, ...)
#                             # loaded from systemd EnvironmentFile or
#                             # ~/.somora/somora.env.
#                             # 'core-only' — codex's restrictive default
#                             # (PATH/HOME/USER/LANG only). Use only after
#                             # auditing every skill — declared env_vars will
#                             # silently appear missing inside shells.

# memory:
#   embedding:
#     provider: local                     # 'local' (@huggingface/transformers) | future: openai/gemini/...
#     model: all-MiniLM-L6-v2             # alias OR full HF repo path (e.g. 'Xenova/foo')
#                                         # known-good aliases: all-MiniLM-L6-v2 (default,
#                                         # 384 dim, ~30MB), all-mpnet-base-v2 (768 dim,
#                                         # ~110MB), paraphrase-multilingual-MiniLM-L12-v2
#                                         # (multilingual, 384 dim, ~120MB)
#   chunking:
#     targetTokens: 400
#     overlapTokens: 80
#   autoInject:
#     queryTurns: 3                       # how many last turns feed the recall query
#     maxResults: 5                       # top-N matches injected
#     minScore: 0.5                       # discard matches below this score
#     maxTokens: 1500                     # hard cap on the injected memory block
#   hybrid:
#     vectorWeight: 0.7                   # weight of vector similarity in fused score
#     bm25Weight: 0.3                     # weight of BM25/FTS5 in fused score

# Workspace — default cwd for file_* tools. NOT a sandbox: agents can
# also write outside (their own persona files, the global config).
# Protection comes from a path-blacklist in the file tools, not from
# confinement here. Per-agent override in agent.yaml under
# `workspace.path`. ~ expands. Auto-created at server start.
# workspace:
#   default: ~/somoraworkspace

# Resources — named SSH targets. file_* and exec tools take an optional
# `target` parameter (default `local`, otherwise one of these names).
# `keyPath` is the private key on the somora server itself. `hostKey`
# (sha256:...) enforces strict mode instead of TOFU.
#
# `allowBlocked` (optional, per resource): a list of command patterns
# that override the global exec blacklist FOR THIS RESOURCE ONLY. Use
# it on dedicated agent-workstations where Somora-agents legitimately
# run admin commands (system updates, kernel reboots, mount fixes).
# Match rule: entry E matches command C if  normalize(C) === normalize(E)
# OR  normalize(C).startsWith(normalize(E) + ' '). The space boundary
# stops `sudo` from matching `pseudo`. The `local` target never gets
# overrides. Every privileged-allowed execution appends a line to
# ~/.somora/audit/exec-privileged.jsonl. See docs/resources.md.
# resources:
#   linuxserver-1:
#     type: ssh
#     host: 192.0.2.10
#     user: alice
#     keyPath: ~/.ssh/id_ed25519
#     description: |
#       Bastion in the workshop. Ubuntu 24.04, Docker installed.
#     workspace: /home/alice/work
#     # hostKey: 'sha256:abc...'      # optional; TOFU when omitted
#   spiderman:
#     type: ssh
#     host: 192.0.2.42
#     user: agent-user
#     keyPath: ~/.ssh/id_ed25519
#     description: |
#       Dedicated AI/GPU workstation. Agents run routine maintenance
#       here; reboot, system updates and mount fixes are normal ops.
#     allowBlocked:
#       - sudo ~/bin/spiderman-system-update.sh
#       - sudo ~/bin/fix-naxon-mount-v2.sh
#       - systemctl reboot
#       - sudo                          # broad: any "sudo ..." command

# Web-tools credentials. Per-provider keys — tools whose provider isn't
# configured are hidden from the agent (the `available()` probe on the
# tool returns false). Brave is the only provider today; free tier gives
# 2k requests/month — sign up at https://api-dashboard.search.brave.com/.
# web:
#   brave:
#     apiKey: "BSAxxx..."

# Sentinel — proactive trigger runtime (time-based fires that wake
# agents on a schedule, see docs/sentinel.md). Only knob today is how
# long completed `at`-triggers (one-shot fires that have already run)
# linger in the registry before they're garbage-collected.
#
# completedRetentionDays:
#   Days a `completed` trigger and its history are kept after the
#   fire's lastFireAt timestamp. The scheduler sweeps at boot and on
#   each daily re-arm tick; older entries get auto-deleted. Set to 0
#   to disable GC entirely (manual cleanup only). Default 7.
# sentinel:
#   completedRetentionDays: 7

# TUI display defaults for the Ink CLI. Render-only — the server still
# injects memory and runs tools regardless. Live-toggle via /show and
# /verbose slash commands.
#
# show.*    — whether the row appears at all
# verbose.* — how much detail shows when it does appear:
#               tools  → full input/output payload below each call/result
#               memory → full memory inject block below each [memory · …]
#               system → /verbose system on prints the persona system prompt once
# tui:
#   show:
#     memory: true
#     tools: true
#   verbose:
#     tools: false
#     memory: false
#     system: false

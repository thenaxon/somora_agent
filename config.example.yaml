# Example somora config. Real config lives at ~/.somora/config.yaml
# (created with sane defaults on first server start). API keys go in plain
# text in the real file — that file stays local, never committed.
#
# Provider names are free-form keys. Pick whatever's memorable for you:
# 'anthropic', 'ollama', 'lmstudio', 'naxxen-cloud', 'pi-im-keller', etc.
#
# Per-model 'alias' lets you reference a model by short nickname anywhere
# (persona frontmatter, later /model in the CLI). Aliases must be globally
# unique across the whole config — server refuses to start otherwise.

server:
  port: 18737

providers:
  # Anthropic via Claude Code subscription. Uses the local Claude Code
  # binary (~/.local/bin/claude) — no baseUrl / apiKey needed.
  anthropic:
    engine: claude-cli
    models:
      - id: claude-opus-4-7
        alias: opus
        contextWindow: 1000000
        capabilities: [text, image]
      - id: claude-sonnet-4-6
        alias: sonnet
        contextWindow: 200000
        capabilities: [text, image]
      - id: claude-haiku-4-5
        alias: haiku
        contextWindow: 200000
        capabilities: [text, image]

  # OpenAI via Codex CLI subscription. Uses the local `codex` binary;
  # auth is handled by the binary itself via `codex login` (ChatGPT
  # Plus/Pro/Business subscription preferred) or OPENAI_API_KEY env.
  # No baseUrl / apiKey needed here. Override binary path with
  # SOMORA_CODEX_BIN env if not at ~/.npm-global/bin/codex or on PATH.
  openai:
    engine: codex-cli
    models:
      - id: gpt-5
        alias: gpt5
        contextWindow: 400000
        capabilities: [text, image]
      - id: gpt-5-codex
        alias: codex5
        contextWindow: 400000
        capabilities: [text]
      - id: o3
        alias: o3
        contextWindow: 200000
        capabilities: [text]

  # Local OpenAI-compatible server (Ollama, LM Studio, oMLX, vLLM, ...).
  # Multiple providers of the same engine are fine — just give each a unique key.
  omlx:
    engine: openai-compatible
    baseUrl: http://192.168.60.47:11434/v1
    apiKey: lm-studio
    models:
      - id: gemma-4-31b-it-8bit
        alias: gemma4big
        contextWindow: 131072
        capabilities: [text, image]
      - id: gemma-4-26b-a4b-it-4bit
        alias: gemma4small
        contextWindow: 131072
        capabilities: [text, image]

  # Same engine, different host — totally fine.
  # ollama:
  #   engine: openai-compatible
  #   baseUrl: http://192.168.60.99:11434/v1
  #   apiKey: dummy
  #   models:
  #     - id: llama3.3:70b
  #       alias: llama
  #       contextWindow: 131072
  #       capabilities: [text]

# Compaction tunables (DECISION #21). All optional — built-in defaults apply
# when omitted. SOMORA_COMPACTION_* env vars override these for ops/CI.
# compaction:
#   triggerRatio: 0.8          # compact when context >= 80% of window
#   safetyCushionPairs: 4      # keep N most-recent user/assistant pairs uncompacted
#   modelOverride: opus        # force a specific worker model (alias or provider/id)

# Memory-Layer tunables (DECISIONS #25–#27). All optional. Per-agent
# overrides can live in agent.yaml later. (Phase 2-Stufe-B — not yet
# wired into the runtime.)
# memory:
